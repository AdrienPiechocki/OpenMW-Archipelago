# Objectives that can be completed. The game's objective is main_quest (option main_quest,
# enabled by default), plus the great house / guild / faction chosen in
# the player YAML (great_house, guild, faction options) and the Daedric quests. Victory
# requires all chosen objectives to be completed.
# Each objective is reached as soon as ONE of the entry's conditions is met:
#   quests:  list of {quest, stage}  -> journal stage >= stage
#   faction: OpenMW faction id       -> rank >= `rank` (10 = faction leader)
#   group:   quest group (see tools/quest_groups.py) -> all quests
#            in the group are completed (completion stage from quest_finals.yaml)
main_quest:
  quests:
    - {quest: c3_destroydagoth, stage: 50}        # death of Dagoth Ur
hlaalu:
  faction: hlaalu
  rank: 10                                        # Grandmaster
telvanni:
  faction: telvanni
  rank: 10                                        # Archmagister
redoran:
  faction: redoran
  rank: 10                                        # Archmaster
fighters_guild:
  faction: fighters guild
  rank: 10                                        # Guildmaster
mages_guild:
  faction: mages guild
  rank: 10                                        # Arch-Mage
thieves_guild:
  faction: thieves guild
  rank: 10                                        # Guildmaster
imperial_cult:
  faction: imperial cult
  rank: 10                                        # Primate
imperial_legion:
  faction: imperial legion
  rank: 10                                        # Knight of the Imperial Dragon
temple:
  faction: temple
  rank: 10                                        # Patriarch
morag_tong:
  faction: morag tong
  rank: 10                                        # Grandmaster
  quests:
    - {quest: mt_grandmaster, stage: 100}         # confirmed ID (UESP): 100 or 110 = new Grandmaster
east_empire_company:
  faction: east empire company                    # Bloodmoon faction (Bloodmoon.esm required)
  rank: 9                                         # Factor (rank 8 in UESP numbering, 9 ranks)
daedric_quests:
  group: daedric                                  # the 7 Daedric quests done (option "Daedric Quests")
# Expansions: when an expansion main-quest option (tribunal_main_quest /
# bloodmoon_main_quest) is enabled, its main
# quest becomes a goal. Journal IDs and finish stages from UESP.
tribunal:
  quests:
    - {quest: tr_sothasil, stage: 100}            # The Mad God: death of Almalexia
bloodmoon:
  quests:
    - {quest: bm_wildhunt, stage: 100}            # Hircine's Hunt: the Hunter is defeated
# Tamriel Rebuilt (TR_Mainland.esm + Tamriel_Data.esm required).
# Main quest (Foul Murder): only a goal if main_quest AND tamriel_rebuilt_main_quest are enabled.
# The quest line is TR_NecMQ_1 -> (TR_NecMQ_2 or TR_NecMQ_2Path) -> ringlets -> TR_NecMQ_3.
# TR_NecMQ_3 stage 200 is the only successful resolution: stages 190/195 are the
# Simine/Alvu-death softlocks. The intermediate journals are mutually exclusive
# branches, so requiring the whole tr_main group (as before) was impossible.
tamriel_rebuilt_main:
  quests:
    - {quest: tr_necmq_3, stage: 200}             # keep the truth about Nerevar
# Faction ids/ranks verified in Tamriel_Data.esm (build/tamriel_data.json):
# T_Mw_HouseIndoril and T_Mw_JaNattaSyndicate, 10 ranks each (rank 10 = leader).
indoril:
  faction: T_Mw_HouseIndoril
  rank: 10                                        # High Councilor
ja_natta_syndicate:
  faction: T_Mw_JaNattaSyndicate
  rank: 10                                        # Boss
