# Quests locked by Archipelago: until the corresponding AP item is
# received, the quest cannot progress (the mod resets its journal to zero). Active
# only if the corresponding `goal` objective is selected in the player YAML
# (daedric_quests: option "Daedric Quests"). Each item is progression.
#   name       AP item name (unique)        id     AP item ID (stable)
#   goal       objective key                 quest  quest ID (journal), lowercase
#   scripts    MWScript scripts of activators (lock before OnActivate)
#   activators ACTI record IDs (fallback if a mod renames the script)
- {name: "Daedric Quest: Azura", id: 7701400, goal: daedric_quests, quest: da_azura, scripts: [DaedraAzura], activators: [active_dae_azura]}
- {name: "Daedric Quest: Boethiah", id: 7701401, goal: daedric_quests, quest: da_boethiah, scripts: [DaedraBoethiah, DaedraBoethiah2], activators: [Ex_DAE_Boethiah_fixed, active_dae_boethiah, active_dae_boethiah_ruin, active_DAE_B_Bo_Head]}
- {name: "Daedric Quest: Malacath", id: 7701402, goal: daedric_quests, quest: da_malacath, scripts: [DaedraMalacath], activators: [active_dae_malacath]}
- {name: "Daedric Quest: Mehrunes Dagon", id: 7701403, goal: daedric_quests, quest: da_mehrunes, scripts: [DaedraMehrunes], activators: [active_dae_mehrunes]}
- {name: "Daedric Quest: Mephala", id: 7701404, goal: daedric_quests, quest: da_mephala, scripts: [DaedraMephala], activators: [active_dae_mephala, active_velothi_altar_Mephala]}
- {name: "Daedric Quest: Molag Bal", id: 7701405, goal: daedric_quests, quest: da_molagbal, scripts: [DaedraMolagBal], activators: [active_dae_molagbal]}
- {name: "Daedric Quest: Sheogorath", id: 7701406, goal: daedric_quests, quest: da_sheogorath, scripts: [DaedraSheogorath], activators: [active_dae_sheogorath]}
