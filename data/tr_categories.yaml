# Category of the Tamriel Rebuilt quests (journal IDs, lowercase). Used by
# tools/quest_groups.py for every journal DEFINED by TR_Mainland.esm
# (data/quest_sources.yaml) or whose ID matches ^tr_m<N>_ .
#   1. listed under main / starting with main_prefixes      -> tr_main
#   2. listed under daedric / starting with daedric_prefixes -> tr_daedric
#   3. a faction token in TR_m<N>_[<place>_]<TOKEN>_*        -> tr_<faction>
#   4. everything else                                       -> tr_side
# TO FILL IN from the ESM (python tools/list_tr.py tr_mainland.json --journals):
#   - the Foul Murder journals (UESP "Tamriel Rebuilt:Foul Murder"),
#   - the Daedric quest journals (UESP lists none yet in the released TR),
#   - the token of House Indoril, if TR has a questline for it (none listed on UESP).
# Tokens confirmed on UESP: hh, ht, tt, jns, eec, ic, mg, tg (the last three often
# carry a number: IC1, MG01, TG1). The others (hr, fg, il, mt) follow the same naming
# but are NOT confirmed.
# After editing: python tools/classify_quests.py && python tools/gen_lua.py
# Foul Murder = TR_NecMQ_* (12 journals, seen in the install.sh output).
main: []
main_prefixes: [tr_necmq_]
# Daedric Prince quests: TR_m1_DA_Clavicus / Sanguine, TR_m7_DA_Meridia / Namira (+ TR_m7_DA_Nam_* steps).
# NB: TR_m3_OE_DA_* (Duke Affair) is NOT Daedric: do not use a generic "_da_" token.
daedric: []
daedric_prefixes: [tr_m1_da_, tr_m7_da_]
faction_tokens:
  hi: indoril           # TR_m3_HI_* (Gorne, Beroth, Nanaav, Roa Dyr, Ilvi, Sandil, MQ1)
  eec: east_empire_company  # TR_m1_EEC_Lora, TR_m3_EEC_*, TR_m7_EEC_*: EEC faction questline
# A token may be followed by a number (and an optional variant letter):
# IC1/IC2, MG01, TG1, MG07a. tools/quest_groups.py matches these variants.
