name: TestMW
game: Morrowind OpenMW

Morrowind OpenMW:
  # Objectives: the main quest (kill Dagoth Ur) is an objective by default. You can
  # add a great house, a guild and a faction: each must be completed
  # (rank 10, leader) to win, and its quest items come from Archipelago.
  # Set main_quest: false to remove the main quest from the objective (then at least
  # one house, one guild, one faction or daedric_quests: true is required).
  main_quest: true
  great_house: none     # none | hlaalu | redoran | telvanni | indoril (Tamriel Rebuilt)
  guild: none           # none | fighters_guild | mages_guild | thieves_guild | cyrodiil_fighters_guild | cyrodiil_mages_guild | cyrodiil_thieves_guild (Project Cyrodiil)
  faction: none         # none | imperial_cult | imperial_legion | temple | morag_tong | east_empire_company (Bloodmoon) | ja_natta_syndicate | ordinators (Tamriel Rebuilt) | kingdom_of_anvil | itinerant_priests (Project Cyrodiil)

  # Adds the 7 Daedric quests to the objective. Each one is locked until its
  # Archipelago item ("Daedric Quest: <prince>") is received.
  daedric_quests: false

  # Vampire clans: a category of its own. You can only belong to ONE clan, so you choose it: you
  # get the quests open to any bloodline + those of your clan, and the final quest of your clan
  # is a goal (Aundae: The Vampire Hunter, Berne: The Vampire Merta, Quarra: The Quarra Amulet).
  # none | unaligned (common quests only, no goal) | aundae | berne | quarra
  vampire_clan: none

  # Trap items (Damage, Bounty, Summon Scamp, Steal Gold) in the item pool.
  # false = no traps (replaced by filler).
  traps: true

  # Starting bonuses (0-100, 0 = vanilla). Each value is ADDED to the stat of your
  # character once the tutorial is over (capped at 100, never lowered).
  attribute_strength: 0
  attribute_intelligence: 0
  attribute_willpower: 0
  attribute_agility: 0
  attribute_speed: 0
  attribute_endurance: 0
  attribute_personality: 0
  attribute_luck: 0

  skill_acrobatics: 0
  skill_alchemy: 0
  skill_alteration: 0
  skill_armorer: 0
  skill_athletics: 0
  skill_axe: 0
  skill_block: 0
  skill_bluntweapon: 0
  skill_conjuration: 0
  skill_destruction: 0
  skill_enchant: 0
  skill_handtohand: 0
  skill_heavyarmor: 0
  skill_illusion: 0
  skill_lightarmor: 0
  skill_longblade: 0
  skill_marksman: 0
  skill_mediumarmor: 0
  skill_mercantile: 0
  skill_mysticism: 0
  skill_restoration: 0
  skill_security: 0
  skill_shortblade: 0
  skill_sneak: 0
  skill_spear: 0
  skill_speechcraft: 0
  skill_unarmored: 0

  # Expansions (Tribunal.esm / Bloodmoon.esm must be loaded in OpenMW):
  #   *_main_quest:  checks of the main quest AND it becomes a goal
  #                  (Tribunal: death of Almalexia, Bloodmoon: Hircine's Hunt)
  #   *_side_quests: checks for the other quests of the expansion (never a goal)
  # Tribunal has no faction quests. The only Bloodmoon faction, the East Empire
  # Company, is chosen with `faction: east_empire_company`.
  tribunal_main_quest: false
  tribunal_side_quests: false
  bloodmoon_main_quest: false
  bloodmoon_side_quests: false

  # Tamriel Rebuilt (TR_Mainland.esm + Tamriel_Data.esm must be loaded in OpenMW):
  #   tamriel_rebuilt_main_quest:    TR main quest (Foul Murder) added to the main quest goal
  #                                  (only if main_quest: true)
  #   tamriel_rebuilt_side_quests:   checks for the TR miscellaneous quests (never a goal)
  #   tamriel_rebuilt_factions:      checks for the TR quests of the great_house / guild / faction
  #                                  chosen above (other factions are ignored); faction:
  #                                  east_empire_company also enables the TR EEC questline
  #   tamriel_rebuilt_daedric_quests: checks for the TR Daedric quests (only if daedric_quests: true)
  tamriel_rebuilt_main_quest: false
  tamriel_rebuilt_side_quests: false
  tamriel_rebuilt_factions: false
  tamriel_rebuilt_daedric_quests: false
  #   tamriel_rebuilt_vampire_clan: none | unaligned | baluath | orlukh; the final quest of the clan
  #                                  is a goal (Baluath: Slay Orlukh Ancient, Orlukh: Namira's Shroud)
  tamriel_rebuilt_vampire_clan: none

  # Project Cyrodiil (Cyr_Main.esm + Tamriel_Data.esm required in openmw.cfg).
  # Its guilds / factions are chosen above (guild: cyrodiil_*, faction: kingdom_of_anvil | itinerant_priests).
  #   project_cyrodiil_side_quests: checks for the other Project Cyrodiil quests (never a goal)
  project_cyrodiil_side_quests: false

  # Quest rewards: the UNIQUE items (named weapons, armor, rings, books...) given by quests
  # and not needed for progression become checks; their items go into the pool.
  # The vanilla reward is removed from your inventory when you would receive it.
  # Gold and consumables are ignored. Only quests whose checks are enabled are affected.
  quest_rewards: true

  death_link: true
